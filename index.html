<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satay Warisan Yati TJ POS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.container{
    display:grid;
    grid-template-columns:220px 1fr 320px;
    height:100vh;
}

/* LEFT PANEL */

.sidebar{
    background:white;
    padding:20px;
    border-right:1px solid #ddd;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.category-btn{
    width:100%;
    padding:15px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:#eee;
    cursor:pointer;
    font-size:16px;
}

.category-btn:hover{
    background:#ff4d6d;
    color:white;
}

/* CENTER PANEL */

.products{
    padding:20px;
    overflow:auto;
}

.products h2{
    margin-bottom:15px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.product-card{
    background:white;
    border-radius:12px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.product-card:hover{
    transform:scale(1.03);
}

.product-card img{
    width:100px;
    height:100px;
    object-fit:cover;
    margin-bottom:10px;
}

.price{
    color:green;
    font-weight:bold;
}

/* RIGHT PANEL */

.cart{
    background:white;
    padding:20px;
    border-left:1px solid #ddd;
}

.cart h2{
    margin-bottom:15px;
}

.order-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.total{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    color:green;
}

.order-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff4d6d;
    color:white;
    font-size:18px;
    cursor:pointer;
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.sidebar{
    display:flex;
    overflow:auto;
    gap:10px;
}

.cart{
    border-left:none;
}

}

</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="sidebar">

        <div class="logo">
            <h2>🍢 Satay Warisan Yati</h2>
        </div>

        <button class="category-btn">
            🍢 Sate
        </button>

        <button class="category-btn">
            🍛 Sampingan
        </button>

        <button class="category-btn">
            🥤 Air
        </button>

        <button class="category-btn">
            📊 Report
        </button>

    </div>

    <!-- CENTER -->
    <div class="products">

        <h2>Menu Utama</h2>

        <div class="product-grid">

            <div class="product-card">
                <h3>Sate Ayam</h3>
                <div class="price">RM1.20</div>
            </div>

            <div class="product-card">
                <h3>Sate Daging</h3>
                <div class="price">RM1.50</div>
            </div>

            <div class="product-card">
                <h3>Sate Kambing</h3>
                <div class="price">RM2.00</div>
            </div>

            <div class="product-card">
                <h3>Sate Perut</h3>
                <div class="price">RM1.70</div>
            </div>

            <div class="product-card">
                <h3>Nasi Lemak</h3>
                <div class="price">RM4.00</div>
            </div>

            <div class="product-card">
                <h3>Teh O Sejuk</h3>
                <div class="price">RM2.50</div>
            </div>

        </div>

    </div>

    <!-- RIGHT -->
    <div class="cart">

        <h2>Order Menu</h2>

        <div class="order-item">
            <span>Sate Ayam x10</span>
            <span>RM12.00</span>
        </div>

        <div class="order-item">
            <span>Nasi Lemak</span>
            <span>RM4.00</span>
        </div>

        <div class="order-item">
            <span>Teh O Sejuk</span>
            <span>RM2.50</span>
        </div>

        <hr>

        <div class="total">
            RM18.50
        </div>

        <button class="order-btn">
            Save Order
        </button>

    </div>

</div>

</body>
</html>
