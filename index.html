<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satay Warisan Yati TJ POS</title>
 
style.css
 
</head>
<body>
 
<div class="container">
 
<h1>🍢 Satay Warisan Yati TJ</h1>
 
<div class="card">
 
<h2>Order Type</h2>
 
<label>
<input type="radio" name="orderType" value="Dine In" checked>
Dine In
</label>
 
<label>
<input type="radio" name="orderType" value="Takeaway">
Takeaway
</label>
 
</div>
 
<div class="card">
 
<h2>Menu Utama</h2>
 
<div class="item">
<label>Sate Ayam</label>
<input type="number" id="ayam" value="0">
</div>
 
<div class="item">
<label>Sate Daging</label>
<input type="number" id="daging" value="0">
</div>
 
<div class="item">
<label>Sate Kambing</label>
<input type="number" id="kambing" value="0">
</div>
 
<div class="item">
<label>Sate Perut</label>
<input type="number" id="perut" value="0">
</div>
 
<div class="item">
<label>Sate Kulit</label>
<input type="number" id="kulit" value="0">
</div>
 
<div class="item">
<label>Sate Tulang</label>
<input type="number" id="tulang" value="0">
</div>
 
<div class="item">
<label>Nasi Impit</label>
<input type="number" id="impit" value="0">
</div>
 
</div>
 
<div class="card">
 
<h2>Menu Sampingan</h2>
 
<button class="food-card" onclick="addNasiLemak()">
🍛 Nasi Lemak
</button>
 
<div id="nasilemakList"></div>
 
</div>
 
<div class="card">
 
<h2>Order Summary</h2>
 
<div id="summary">
 
No item selected
 
</div>
 
<h2 id="total">
 
RM0.00
 
</h2>
 
</div>
 
<div class="card">
 
<button onclick="saveOrder()">
 
💾 Save Order
 
</button>
 
</div>
 
</div>
 
app.jsscript>
 
</body>
</html>
