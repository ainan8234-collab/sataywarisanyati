<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satay Warisan Yati TJ POS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.container{
    display:grid;
    grid-template-columns:220px 1fr 320px;
    height:100vh;
}

/* LEFT PANEL */

.sidebar{
    background:white;
    padding:20px;
    border-right:1px solid #ddd;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.category-btn{
    width:100%;
    padding:15px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:#eee;
    cursor:pointer;
    font-size:16px;
}

.category-btn:hover{
    background:#ff4d6d;
    color:white;
}

/* CENTER PANEL */

.products{
    padding:20px;
    overflow:auto;
}

.products h2{
    margin-bottom:15px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.product-card{
    background:white;
    border-radius:12px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.product-card:hover{
    transform:scale(1.03);
}

.product-card img{
    width:100px;
    height:100px;
    object-fit:cover;
    margin-bottom:10px;
}

.price{
    color:green;
    font-weight:bold;
}

/* RIGHT PANEL */

.cart{
    background:white;
    padding:20px;
    border-left:1px solid #ddd;
}

.cart h2{
    margin-bottom:15px;
}

.order-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.total{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    color:green;
}

.order-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff4d6d;
    color:white;
    font-size:18px;
    cursor:pointer;
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.sidebar{
    display:flex;
    overflow:auto;
    gap:10px;
}

.cart{
    border-left:none;
}

}

</style>
</head>
<script>

let cart = [];
function showSate(){

document.getElementById("menuTitle").innerHTML =
"🍢 Menu Sate";

document.getElementById("productGrid").innerHTML = `

<div class="product-card" onclick="qtyPopup('Sate Ayam',1.20)">
<h3>Sate Ayam</h3>
<div class="price">RM1.20</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Daging',1.50)">
<h3>Sate Daging</h3>
<div class="price">RM1.50</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Kambing',2.00)">
<h3>Sate Kambing</h3>
<div class="price">RM2.00</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Perut',1.70)">
<h3>Sate Perut</h3>
<div class="price">RM1.70</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Kulit',1.70)">
<h3>Sate Kulit</h3>
<div class="price">RM1.70</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Tulang',1.80)">
<h3>Sate Tulang</h3>
<div class="price">RM1.80</div>
</div>

<div class="product-card" onclick="qtyPopup('Nasi Impit',1.00)">
<h3>Nasi Impit</h3>
<div class="price">RM1.00</div>
</div>

`;

}
function showSampingan(){
 
alert("Butang Sampingan Berfungsi");
 
}    

document.getElementById("menuTitle").innerHTML =
"🍛 Menu Sampingan";

document.getElementById("productGrid").innerHTML = `

<div class="product-card" onclick="showNasiLemakPopup()">
<h3>Nasi Lemak</h3>
<div class="price">RM4.00</div>
</div>

`;

}
function airPopup(item,hotPrice,coldPrice){

let panas = confirm(
item + "\n\nOK = Panas\nCancel = Sejuk"
);

let jenis;
let harga;

if(panas){
    jenis = " Panas";
    harga = hotPrice;
}else{
    jenis = " Sejuk";
    harga = coldPrice;
}

let qty = prompt(
"Masukkan Kuantiti",
"1"
);

if(qty===null || qty==="" || qty<=0){
    return;
}

cart.push({
    name:item + jenis,
    qty:Number(qty),
    price:harga
});

renderCart();

}
function showNasiLemakPopup(){

let total = 4;
let nama = "Nasi Lemak";

if(confirm("Tambah Telur Mata?")){
    total += 1;
    nama += " + Telur Mata";
}

if(confirm("Tambah Ayam Merah?")){
    total += 4.5;
    nama += " + Ayam Merah";
}

if(confirm("Tambah Ayam Rendang?")){
    total += 4.5;
    nama += " + Ayam Rendang";
}

if(confirm("Tambah Telur Rebus?")){
    total += 1.5;
    nama += " + Telur Rebus";
}

if(confirm("Tambah Telur Rendang?")){
    total += 2;
    nama += " + Telur Rendang";
}

cart.push({
    name:nama,
    qty:1,
    price:total
});

renderCart();

}
function qtyPopup(item,price){

let qty = prompt(
"Masukkan kuantiti untuk " + item,
"10"
);

if(qty===null || qty==="" || qty<=0){
return;
}

cart.push({
name:item,
qty:Number(qty),
price:price
});

renderCart();

}
function airPopup(item,hotPrice,coldPrice){

let panas = confirm(
item + "\n\nOK = Panas\nCancel = Sejuk"
);

let jenis;
let harga;

if(panas){
    jenis = " Panas";
    harga = hotPrice;
}else{
    jenis = " Sejuk";
    harga = coldPrice;
}

let qty = prompt(
"Masukkan kuantiti",
"1"
);

if(qty===null || qty==="" || qty<=0){
    return;
}

cart.push({
    name:item + jenis,
    qty:Number(qty),
    price:harga
});

renderCart();

}
function renderCart(){

let html = "";
let total = 0;

cart.forEach((item,index)=>{

let amount =
item.qty * item.price;

total += amount;

html += `
<div class="order-item">
<span>${item.name} x${item.qty}</span>
<span>RM${amount.toFixed(2)}</span>
</div>
`;

});

if(html===""){
html="Tiada pesanan lagi";
}

document.getElementById("cartItems").innerHTML = html;

document.getElementById("cartTotal").innerHTML =
"RM" + total.toFixed(2);

}
window.onload = function(){
    showSate();
}
</script>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="sidebar">

        <div class="logo">
            <h2>🍢 Satay Warisan Yati</h2>
        </div>

 <button class="category-btn" onclick="showSate()">
    🍢 Sate
</button>

<button class="category-btn" onclick="showSampingan()">
    🍛 Sampingan
</button>

<button class="category-btn" onclick="showAir()">
    🥤 Air
</button>

    </div>

    <!-- CENTER -->
   <div class="products">

    <h2 id="menuTitle">Menu Utama</h2>

 <div class="product-grid" id="productGrid">

</div>
        
        </div>

    </div>

<!-- RIGHT -->
<div class="cart">

    <h2>Order Menu</h2>

    <div id="cartItems">
        Tiada pesanan lagi
    </div>

    <hr>

    <div class="total" id="cartTotal">
        RM0.00
    </div>

    <button class="order-btn">
        Save Order
    </button>

</div>

</div>

</body>
</html>
