<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satay Warisan Yati TJ POS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.container{
    display:grid;
    grid-template-columns:220px 1fr 320px;
    height:100vh;
}

/* LEFT PANEL */

.sidebar{
    background:white;
    padding:20px;
    border-right:1px solid #ddd;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.category-btn{
    width:100%;
    padding:15px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:#eee;
    cursor:pointer;
    font-size:16px;
}

.category-btn:hover{
    background:#ff4d6d;
    color:white;
}

/* CENTER PANEL */

.products{
    padding:20px;
    overflow:auto;
}

.products h2{
    margin-bottom:15px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.product-card{
    background:white;
    border-radius:12px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.product-card:hover{
    transform:scale(1.03);
}

.product-card img{
    width:100px;
    height:100px;
    object-fit:cover;
    margin-bottom:10px;
}

.price{
    color:green;
    font-weight:bold;
}

/* RIGHT PANEL */

.cart{
    background:white;
    padding:20px;
    border-left:1px solid #ddd;
}

.cart h2{
    margin-bottom:15px;
}

.order-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.total{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    color:green;
}

.order-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff4d6d;
    color:white;
    font-size:18px;
    cursor:pointer;
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.sidebar{
    display:flex;
    overflow:auto;
    gap:10px;
}

.cart{
    border-left:none;
}

}

</style>
</head>
<script>

let cart = [];
let savedOrders = [];
let orderNo = 1;
function showSate(){

document.getElementById("menuTitle").innerHTML =
"🍢 Menu Sate";

document.getElementById("productGrid").innerHTML = `


<div class="product-card" onclick="qtyPopup('Sate Ayam',1.20)">
<h3>Sate Ayam</h3>
<div class="price">RM1.20</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Daging',1.50)">
<h3>Sate Daging</h3>
<div class="price">RM1.50</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Kambing',2.00)">
<h3>Sate Kambing</h3>
<div class="price">RM2.00</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Perut',1.70)">
<h3>Sate Perut</h3>
<div class="price">RM1.70</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Kulit',1.70)">
<h3>Sate Kulit</h3>
<div class="price">RM1.70</div>
</div>

<div class="product-card" onclick="qtyPopup('Sate Tulang',1.80)">
<h3>Sate Tulang</h3>
<div class="price">RM1.80</div>
</div>

<div class="product-card" onclick="qtyPopup('Nasi Impit',1.00)">
<h3>Nasi Impit</h3>
<div class="price">RM1.00</div>
</div>

`;

}
function showSampingan(){

document.getElementById("menuTitle").innerHTML =
"🍛 Menu Sampingan";

document.getElementById("productGrid").innerHTML = `

<div class="product-card" onclick="showNasiLemakPopup()">
<h3>Nasi Lemak</h3>
<div class="price">RM4.00</div>
</div>

`;

}
    function showAir(){

document.getElementById("menuTitle").innerHTML =
"🥤 Menu Air";

document.getElementById("productGrid").innerHTML = `

<div class="product-card" onclick="showAirOption('Teh O',2.00,2.50)">
<h3>Teh O</h3>
<div class="price">Panas / Sejuk</div>
</div>

<div class="product-card" onclick="showAirOption('Teh',3.00,4.00)">
<h3>Teh</h3>
<div class="price">Panas / Sejuk</div>
</div>

<div class="product-card" onclick="showAirOption('Milo',3.00,4.50)">
<h3>Milo</h3>
<div class="price">Panas / Sejuk</div>
</div>

<div class="product-card" onclick="showAirOption('Nescafe',3.00,4.50)">
<h3>Nescafe</h3>
<div class="price">Panas / Sejuk</div>
</div>

<div class="product-card" onclick="showAirOption('Neslo',4.50,5.50)">
<h3>Neslo</h3>
<div class="price">Panas / Sejuk</div>
</div>

<div class="product-card" onclick="showAirOption('Sirap',3.50,3.50)">
<h3>Sirap</h3>
<div class="price">RM3.50</div>
</div>

<div class="product-card" onclick="showAirOption('Tebu',3.50,3.50)">
<h3>Tebu</h3>
<div class="price">RM3.50</div>
</div>

<div class="product-card" onclick="showAirOption('Jagung',3.50,3.50)">
<h3>Jagung</h3>
<div class="price">RM3.50</div>
</div>

<div class="product-card" onclick="showAirOption('Extrajoss Anggur',4.50,4.50)">
<h3>Extrajoss Anggur</h3>
<div class="price">RM4.50</div>
</div>

<div class="product-card" onclick="showAirOption('Extrajoss Mangga',4.50,4.50)">
<h3>Extrajoss Mangga</h3>
<div class="price">RM4.50</div>
</div>

<div class="product-card" onclick="showAirOption('Extrajoss Oren',4.50,4.50)">
<h3>Extrajoss Oren</h3>
<div class="price">RM4.50</div>
</div>

<div class="product-card" onclick="showAirOption('Air Suam',0.50,0.50)">
<h3>Air Suam</h3>
<div class="price">RM0.50</div>
</div>

<div class="product-card" onclick="showAirOption('Air Kosong',0.80,0.80)">
<h3>Air Kosong</h3>
<div class="price">RM0.80</div>
</div>

`;

}
function showAirOption(item,hotPrice,coldPrice){

document.getElementById("menuTitle").innerHTML =
item + " Pilihan";

document.getElementById("productGrid").innerHTML = `

<div class="product-card" onclick="showAir()">
<h3>⬅️ Kembali</h3>
</div>

<div class="product-card"
onclick="qtyPopup('${item} Panas',${hotPrice})">
<h3>☕ Panas</h3>
<div class="price">RM${hotPrice.toFixed(2)}</div>
</div>

<div class="product-card"
onclick="qtyPopup('${item} Sejuk',${coldPrice})">
<h3>🧊 Sejuk</h3>
<div class="price">RM${coldPrice.toFixed(2)}</div>
</div>

`;

}
   
function showNasiLemakPopup(){

let pilihan = prompt(
`Add On Nasi Lemak

1 = Telur Mata (+RM1.00)
2 = Ayam Merah (+RM4.50)
3 = Ayam Rendang (+RM4.50)
4 = Telur Rebus (+RM1.50)
5 = Telur Rendang (+RM2.00)

Contoh:
1,3`
);

let total = 4;
let nama = "Nasi Lemak";

if(!pilihan){

cart.push({
    name:nama,
    qty:1,
    price:total
});

renderCart();
return;

}

if(pilihan.includes("1")){
    total += 1;
    nama += " + Telur Mata";
}

if(pilihan.includes("2")){
    total += 4.5;
    nama += " + Ayam Merah";
}

if(pilihan.includes("3")){
    total += 4.5;
    nama += " + Ayam Rendang";
}

if(pilihan.includes("4")){
    total += 1.5;
    nama += " + Telur Rebus";
}

if(pilihan.includes("5")){
    total += 2;
    nama += " + Telur Rendang";
}

cart.push({
    name:nama,
    qty:1,
    price:total
});

renderCart();

}

function qtyPopup(item,price){

let qty = prompt(
"Masukkan kuantiti untuk " + item,
"1"
);

if(qty===null || qty==="" || qty<=0){
return;
}

cart.push({
name:item,
qty:Number(qty),
price:price
});

renderCart();

}

function renderCart(){

let html = "";
let total = 0;

cart.forEach((item,index)=>{

let amount =
item.qty * item.price;

total += amount;

html += `
<div class="order-item">
<span>${item.name} x${item.qty}</span>

<span>
RM${amount.toFixed(2)}
<button onclick="deleteItem(${index})"
style="
margin-left:8px;
background:red;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
padding:3px 8px;
">
❌
</button>
</span>

</div>
`;

});

if(html===""){
html="Tiada pesanan lagi";
}

document.getElementById("cartItems").innerHTML = html;

document.getElementById("cartTotal").innerHTML =
"RM" + total.toFixed(2);

}
function deleteItem(index){

cart.splice(index,1);

renderCart();

}
function saveOrder(){

if(cart.length === 0){
    alert("Tiada pesanan untuk disimpan");
    return;
}

savedOrders.push({
    orderNo: orderNo,
    items: [...cart]
});

renderOrderHistory();

alert("Order #" + orderNo + " berjaya disimpan");

orderNo++;

cart = [];

renderCart();

}

function renderOrderHistory(){

let html = "";

savedOrders.forEach(order => {

html += `
<div style="
padding:10px;
margin-top:10px;
background:#f5f5f5;
border-radius:8px;
">

<b>Order #${order.orderNo}</b><br><br>
`;

let orderTotal = 0;

order.items.forEach(item => {

let amount = item.qty * item.price;

orderTotal += amount;

html += `
${item.name} x${item.qty}
(RM${amount.toFixed(2)})<br>
`;

});

html += `
<br>
<b>Total: RM${orderTotal.toFixed(2)}</b>
`;

html += `
</div>
`;

});

if(html===""){
html = "Tiada order lagi";
}

document.getElementById("orderHistory").innerHTML =
html;

}
    window.onload = function(){
    showSate();
}
</script>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="sidebar">

        <div class="logo">
            <h2>🍢 Satay Warisan Yati</h2>
        </div>

 <button class="category-btn" onclick="showSate()">
    🍢 Sate
</button>

<button class="category-btn" onclick="showSampingan()">
    🍛 Sampingan
</button>

<button class="category-btn" onclick="showAir()">
    🥤 Air
</button>

    </div>

    <!-- CENTER -->
   <div class="products">

    <h2 id="menuTitle">Menu Utama</h2>

 <div class="product-grid" id="productGrid">

</div>
        
        </div>

    </div>

<!-- RIGHT -->
<div class="cart">

    <h2>Order Menu</h2>

    <div id="cartItems">
        Tiada pesanan lagi
    </div>

    <hr>

<div class="total" id="cartTotal">
    RM0.00
</div>

<button class="order-btn" onclick="saveOrder()">
    Save Order
</button>

<hr>

<h3>Order History</h3>

<div id="orderHistory">
Tiada order lagi
</div>

</div>

</div>

</body>
</html>
